                 <div class="contr">
                    <input type="password" name="contraseña" placeholder="Introduce tu contraseña" required id="con1">

                 </div>
                

                <label for="con2">Confirma Contraseña</label>
                <div class="contr">
                   <input type="password" name="comp" placeholder="Reintroduce tu contraseña" required id="con2">

                 </div>
